<line x1="590" y1="80" x2="288.4" y2="311.0" stroke="#999" stroke-width="2" stroke-dasharray="6 5"/>
<text x="447.2" y="187.5" font-size="13" text-anchor="start" font-weight="bold" fill="#666" dominant-baseline="central">d3</text>
<line x1="70" y1="80" x2="288.4" y2="311.0" stroke="#999" stroke-width="2" stroke-dasharray="6 5"/>
<text x="187.2" y="187.5" font-size="13" text-anchor="start" font-weight="bold" fill="#666" dominant-baseline="central">d4</text>
<rect x="272.4" y="285.0" width="32" height="52" rx="6" fill="#444"/><rect x="276.4" y="291.0" width="24" height="36" fill="#9CC3E6"/>
<text x="288.4" y="353.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#222" dominant-baseline="central">Mobil (x, y) = ?</text>
<line x1="70" y1="500" x2="712" y2="290" stroke="#2F6FD6" stroke-width="2" stroke-dasharray="2 4" marker-end="url(#ab)" opacity="0.8"/>
<line x1="590" y1="500" x2="712" y2="290" stroke="#2F6FD6" stroke-width="2" stroke-dasharray="2 4" marker-end="url(#ab)" opacity="0.8"/>
<line x1="590" y1="80" x2="712" y2="290" stroke="#2F6FD6" stroke-width="2" stroke-dasharray="2 4" marker-end="url(#ab)" opacity="0.8"/>
<line x1="70" y1="80" x2="712" y2="290" stroke="#2F6FD6" stroke-width="2" stroke-dasharray="2 4" marker-end="url(#ab)" opacity="0.8"/>
<rect x="40" y="480" width="60" height="40" rx="6" fill="#2F3B40"/>
<text x="70" y="496" font-size="15" text-anchor="middle" font-weight="bold" fill="#fff" dominant-baseline="central">A1</text>
<text x="70" y="511" font-size="10" text-anchor="middle" font-weight="normal" fill="#ccc" dominant-baseline="central">ESP32</text>
<text x="70" y="534" font-size="12" text-anchor="middle" font-weight="normal" fill="#444" dominant-baseline="central">(0, 0)</text>
<rect x="560" y="480" width="60" height="40" rx="6" fill="#2F3B40"/>
<text x="590" y="496" font-size="15" text-anchor="middle" font-weight="bold" fill="#fff" dominant-baseline="central">A2</text>
<text x="590" y="511" font-size="10" text-anchor="middle" font-weight="normal" fill="#ccc" dominant-baseline="central">ESP32</text>
<text x="590" y="534" font-size="12" text-anchor="middle" font-weight="normal" fill="#444" dominant-baseline="central">(B, 0)</text>
<rect x="560" y="60" width="60" height="40" rx="6" fill="#2F3B40"/>
<text x="590" y="76" font-size="15" text-anchor="middle" font-weight="bold" fill="#fff" dominant-baseline="central">A3</text>
<text x="590" y="91" font-size="10" text-anchor="middle" font-weight="normal" fill="#ccc" dominant-baseline="central">ESP32</text>
<text x="590" y="46" font-size="12" text-anchor="middle" font-weight="normal" fill="#444" dominant-baseline="central">(B, H)</text>
<rect x="40" y="60" width="60" height="40" rx="6" fill="#2F3B40"/>
<text x="70" y="76" font-size="15" text-anchor="middle" font-weight="bold" fill="#fff" dominant-baseline="central">A4</text>
<text x="70" y="91" font-size="10" text-anchor="middle" font-weight="normal" fill="#ccc" dominant-baseline="central">ESP32</text>
<text x="70" y="46" font-size="12" text-anchor="middle" font-weight="normal" fill="#444" dominant-baseline="central">(0, H)</text>
<rect x="712" y="256" width="96" height="68" rx="8" fill="#2F3B40"/>
<text x="760" y="280" font-size="15" text-anchor="middle" font-weight="bold" fill="#fff" dominant-baseline="central">Gateway</text>
<text x="760" y="300" font-size="11" text-anchor="middle" font-weight="normal" fill="#ccc" dominant-baseline="central">ESP32</text>
<text x="760" y="340" font-size="12" text-anchor="middle" font-weight="normal" fill="#444" dominant-baseline="central">beregner (x, y)</text>
<rect x="690" y="390" width="140" height="50" rx="8" fill="#E8F3E6" stroke="#2E8B3A"/>
<text x="760" y="407" font-size="14" text-anchor="middle" font-weight="bold" fill="#222" dominant-baseline="central">Router</text>
<text x="760" y="426" font-size="12" text-anchor="middle" font-weight="normal" fill="#444" dominant-baseline="central">IoT_H3/4</text>
<rect x="690" y="490" width="140" height="50" rx="8" fill="#E8F3E6" stroke="#2E8B3A"/>
<text x="760" y="507" font-size="14" text-anchor="middle" font-weight="bold" fill="#222" dominant-baseline="central">MQTT-server</text>
<text x="760" y="526" font-size="12" text-anchor="middle" font-weight="normal" fill="#444" dominant-baseline="central">wilsons.local:8883</text>
<line x1="760" y1="324" x2="760" y2="388" stroke="#2E8B3A" stroke-width="3" marker-end="url(#ag)"/>
<line x1="760" y1="440" x2="760" y2="488" stroke="#2E8B3A" stroke-width="3" marker-end="url(#ag)"/>
<line x1="70" y1="560" x2="120" y2="560" stroke="#999" stroke-width="3" stroke-dasharray='6 5'/>
<text x="132" y="560" font-size="13" text-anchor="start" font-weight="normal" fill="#222" dominant-baseline="central">RSSI: ankrene lytter på mobilens wifi-pakker (sniffing)</text>
<line x1="70" y1="586" x2="120" y2="586" stroke="#2F6FD6" stroke-width="3" stroke-dasharray='2 4'/>
<text x="132" y="586" font-size="13" text-anchor="start" font-weight="normal" fill="#222" dominant-baseline="central">ESP-NOW, krypteret: ankre sender RSSI til gateway</text>
<line x1="70" y1="612" x2="120" y2="612" stroke="#2E8B3A" stroke-width="3" />
<text x="132" y="612" font-size="13" text-anchor="start" font-weight="normal" fill="#222" dominant-baseline="central">Wi-fi + MQTT med TLS: gateway sender id, tid og (x, y)</text>
<rect x="60" y="650" width="780" height="180" rx="10" fill="#FFF8E6" stroke="#E0B040"/>
<text x="80" y="674" font-size="15" text-anchor="start" font-weight="bold" fill="#222" dominant-baseline="central">Sådan bygges hver node</text>
<text x="80" y="702" font-size="12.5" text-anchor="start" font-weight="normal" fill="#222" dominant-baseline="central">• Hver node = 1 ESP32 DevKit V1 + USB-strøm (powerbank eller USB-lader). Ingen breadboard eller ledninger.</text>
<text x="80" y="723" font-size="12.5" text-anchor="start" font-weight="normal" fill="#222" dominant-baseline="central">• Status vises med den indbyggede blå LED (GPIO 2), så der skal ikke kobles noget til.</text>
<text x="80" y="744" font-size="12.5" text-anchor="start" font-weight="normal" fill="#222" dominant-baseline="central">• Minimum: 3 ankre + 1 gateway = 4 ESP32. Bedst: 4 ankre i hjørnerne + 1 gateway = 5 ESP32.</text>
<text x="80" y="765" font-size="12.5" text-anchor="start" font-weight="normal" fill="#222" dominant-baseline="central">• Ankrene skal stå i samme højde, med antennen (enden uden USB) fri og pegende ind mod lokalet.</text>
<text x="80" y="786" font-size="12.5" text-anchor="start" font-weight="normal" fill="#222" dominant-baseline="central">• Alle enheder skal være på samme kanal som routeren IoT_H3/4 (ankrene finder den selv ved opstart).</text>
<text x="80" y="807" font-size="12.5" text-anchor="start" font-weight="normal" fill="#222" dominant-baseline="central">• Testmobilen skal være forbundet til IoT_H3/4, ellers sender den ikke på den kanal, ankrene lytter på.</text>
</svg>