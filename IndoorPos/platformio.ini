; Ét projekt, fem programmer: én gateway og fire ankre.
; Upload til et bestemt board: vælg miljøet nederst i VS Code (fx "env:anchor1").

[env]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200

[env:gateway]
build_src_filter = +<gateway/>
lib_deps = knolleary/PubSubClient@^2.8

[env:anchor1]
build_src_filter = +<anchor/>
build_flags = -D ANCHOR_ID=1

[env:anchor2]
build_src_filter = +<anchor/>
build_flags = -D ANCHOR_ID=2

[env:anchor3]
build_src_filter = +<anchor/>
build_flags = -D ANCHOR_ID=3

[env:anchor4]
build_src_filter = +<anchor/>
build_flags = -D ANCHOR_ID=4
