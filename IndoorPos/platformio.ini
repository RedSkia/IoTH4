; Ét program til alle boards. Rollen (gateway eller anker) vælges i Serial Monitor.

[env:esp32]
platform = espressif32@8.0.0                       ; låst: koden kræver Arduino-ESP32 3.x
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
lib_deps =
  positioning                                      ; lib/positioning
  knolleary/PubSubClient@^2.8
